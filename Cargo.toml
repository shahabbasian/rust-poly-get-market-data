[package]
name = "polymarket-scanner"
version = "0.1.0"
edition = "2021"
description = "Polymarket scanner + Phase 2 real-time orderbook collector"

[lib]
path = "src/lib.rs"

[[bin]]
name = "polymarket-scanner"
path = "src/main.rs"

[[bin]]
name = "collector"
path = "src/bin/collector.rs"

[[bin]]
name = "price_sampler"
path = "src/bin/price_sampler.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio-stream = "0.1"
rust_decimal = { version = "1", features = ["serde"] }
polymarket_client_sdk_v2 = { version = "0.6.0-canary.1", default-features = false, features = ["ws", "rtds", "clob"] }
dashmap = "6"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
